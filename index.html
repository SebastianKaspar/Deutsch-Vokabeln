<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#f4f4f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vokabeltrainer ES → DE</title>
<style>
:root{
  --bg:#f4f4f2; --karte:#ffffff; --text:#1c1c1c; --grau:#6b6b6b;
  --blau:#1f5fa9; --gruen:#1a7f37; --rot:#c22b2b; --gelb:#a86400; --lila:#6b3fa0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex; flex-direction:column; overflow:hidden;
}
header{display:flex;justify-content:space-between;font-size:13px;color:var(--grau);padding:12px 18px 6px}
main{
  flex:1; margin:0 12px; background:var(--karte); border:1px solid #e0e0dc;
  border-radius:16px; padding:18px 16px; display:flex; flex-direction:column;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
}
footer{display:flex;align-items:center;gap:8px;padding:10px 18px 14px;font-size:13px;color:var(--grau)}
#typ{font-size:13px;color:var(--grau);text-align:center;margin-top:6px}
#frage{font-size:34px;font-weight:700;text-align:center;margin:6px 0 18px;line-height:1.15}
#antwort{
  width:100%; font-size:22px; text-align:center; padding:14px 10px; border:0;
  border-radius:12px; background:#f0f0ec; color:var(--text); font-family:inherit;
}
#antwort:focus{outline:2px solid var(--blau)}
#umlaute{display:flex;justify-content:center;gap:6px;margin:10px 0}
#umlaute button{
  flex:0 0 auto; min-width:44px; padding:10px 0; font-size:17px; border:0;
  border-radius:10px; background:#e8e8e4; color:var(--text); font-family:inherit;
}
#haupt{
  width:100%; margin-top:4px; padding:16px; font-size:17px; font-weight:600; border:0;
  border-radius:12px; background:var(--blau); color:#fff; font-family:inherit;
}
#haupt.siguiente{background:#3a3a38}
#loesung{margin-top:18px;text-align:center}
#urteil{font-size:15px;font-weight:700}
#wort{font-size:28px;font-weight:700;margin:4px 0}
#gramatica{font-size:16px;font-weight:600}
#extra{font-size:15px;color:var(--grau);white-space:pre-line;margin-top:4px}
.tonos{display:flex;justify-content:center;gap:8px;margin-top:14px}
.tonos button{
  padding:10px 16px;font-size:15px;border:0;border-radius:10px;
  background:#e8e8e4;color:var(--text);font-family:inherit;
}
#voz{
  flex:1; min-width:0; font-size:13px; font-family:inherit; color:var(--grau);
  background:#e8e8e4; border:0; border-radius:8px; padding:7px;
}
#probar{padding:7px 12px;font-size:13px;border:0;border-radius:8px;background:#e8e8e4;font-family:inherit}
#sinvoz{color:var(--rot);font-size:12px;line-height:1.3}
button{cursor:pointer}
[hidden]{display:none !important}
</style>
</head>
<body>
<header><span id="contador"></span><span id="puntos"></span></header>

<main>
  <div id="typ"></div>
  <div id="frage">…</div>
  <input id="antwort" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="palabra en alemán">
  <div id="umlaute"></div>
  <button id="haupt">Comprobar</button>

  <section id="loesung" hidden>
    <div id="urteil"></div>
    <div id="wort"></div>
    <div id="gramatica"></div>
    <div id="extra"></div>
    <div class="tonos">
      <button id="ton-palabra">🔊 palabra</button>
      <button id="ton-frase" hidden>🔊 frase</button>
    </div>
  </section>
</main>

<footer>
  <span>voz:</span>
  <select id="voz"></select>
  <button id="probar">probar</button>
  <span id="sinvoz" hidden></span>
</footer>

const TYP_ES = {nomen:"sustantivo", verb:"verbo", adjektiv:"adjetivo", adverb:"adverbio"};
const KASUS_COLOR = {
  "Akkusativ":"var(--blau)", "Dativ":"var(--gelb)",
  "Dativ + Akkusativ":"var(--lila)", "ohne Objekt":"var(--grau)"
};
const FAECHER = {1:0, 2:1, 3:3, 4:7, 5:21};
const POR_RONDA = 20;
const AVISO_SIN_VOZ = "Ajustes › Accesibilidad › Contenido hablado › Voces › Alemán";

const $ = id => document.getElementById(id);

/* ---------------------------------------------------------------- Fortschritt */
function cargar(){
  try{ return JSON.parse(localStorage.getItem("fortschritt") || "{}"); }
  catch(e){ return {}; }
}
function guardar(datos){
  try{ localStorage.setItem("fortschritt", JSON.stringify(datos)); }catch(e){}
}
const hoy = () => new Date().toISOString().slice(0,10);
function masDias(dias){
  const d = new Date(); d.setDate(d.getDate()+dias);
  return d.toISOString().slice(0,10);
}

/* ------------------------------------------------------------ Antwortprüfung */
function normalizar(t){
  t = t.trim().toLowerCase();
  t = t.replace(/^(der|die|das)\s+/,"").replace(/^sich\s+/,"");
  t = t.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  return t.replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
}
function articuloDe(t){
  const m = t.trim().toLowerCase().match(/^(der|die|das)\b/);
  return m ? m[1] : null;
}
function distancia(a,b){
  if(a === b) return 0;
  let prev = Array.from({length:b.length+1}, (_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const act=[i];
    for(let j=1;j<=b.length;j++){
      act.push(Math.min(prev[j]+1, act[j-1]+1, prev[j-1]+(a[i-1]!==b[j-1]?1:0)));
    }
    prev=act;
  }
  return prev[b.length];
}
function comprobar(entrada, carta){
  if(!entrada.trim()) return "falsch";
  const usuario = normalizar(entrada);
  const soluciones = [normalizar(carta.de), ...carta.alt.map(normalizar)];
  if(soluciones.includes(usuario)){
    const art = articuloDe(entrada);
    if(carta.typ === "nomen" && art && art !== carta.art) return "fast";
    return "richtig";
  }
  for(const s of soluciones){
    if(s.length >= 5 && distancia(usuario, s) <= 1) return "fast";
  }
  return "falsch";
}

/* ------------------------------------------------------------------- Stimme */
let voces = [], vozActual = null;

function cargarVoces(){
  const todas = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voces = todas.filter(v => (v.lang||"").toLowerCase().startsWith("de"));
  voces.sort((a,b)=>{
    const pa = a.lang.toLowerCase().startsWith("de-de") ? 0 : 1;
    const pb = b.lang.toLowerCase().startsWith("de-de") ? 0 : 1;
    return pa-pb || a.name.localeCompare(b.name);
  });
  const sel = $("voz");
  sel.innerHTML = "";
  voces.forEach((v,i)=>{
    const o = document.createElement("option");
    o.value = i; o.textContent = v.name + " (" + v.lang + ")";
    sel.appendChild(o);
  });
  const guardada = (()=>{ try{ return localStorage.getItem("voz"); }catch(e){ return null; } })();
  const idx = Math.max(0, voces.findIndex(v => v.name === guardada));
  vozActual = voces[idx] || null;
  sel.value = String(idx < 0 ? 0 : idx);
  const hay = voces.length > 0;
  sel.hidden = !hay; $("probar").hidden = !hay;
  $("sinvoz").hidden = hay;
  if(!hay) $("sinvoz").textContent = AVISO_SIN_VOZ;
}

/* Nur deutsche Stimmen — ohne deutsche Stimme bleibt es stumm. */
function hablar(texto){
  if(!texto || !vozActual || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.voice = vozActual;
    u.lang = vozActual.lang || "de-DE";
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function textoHablado(c){
  if(c.typ === "nomen"){
    const p = c.art ? c.art + " " + c.de : c.de;
    if(c.plural && c.plural !== "nur Plural" && c.plural !== "nur Singular")
      return p + ". Plural: die " + c.plural + ".";
    return p;
  }
  return c.de;
}

/* ------------------------------------------------------------------- Ablauf */
let fortschritt = cargar(), ronda = [], indice = 0, aciertos = 0, resuelto = false;

function armarRonda(){
  const h = hoy(), vencidas = [], nuevas = [];
  VOKABELN.forEach(c=>{
    const e = fortschritt[c.id];
    if(!e) nuevas.push(c);
    else if((e.faellig || h) <= h) vencidas.push([e.fach||1, c]);
  });
  vencidas.sort((a,b)=>a[0]-b[0]);
  let r = vencidas.slice(0, POR_RONDA).map(p=>p[1]);
  nuevas.sort(()=>Math.random()-0.5);
  r = r.concat(nuevas.slice(0, Math.max(0, POR_RONDA - r.length)));
  return r.sort(()=>Math.random()-0.5);
}

function actualizarEstado(carta, resultado){
  const e = fortschritt[carta.id] || {fach:1, richtig:0, falsch:0};
  let fach = e.fach || 1;
  if(resultado === "richtig"){ fach = Math.min(5, fach+1); e.richtig = (e.richtig||0)+1; }
  else if(resultado === "falsch"){ fach = 1; e.falsch = (e.falsch||0)+1; }
  e.fach = fach;
  e.faellig = masDias(FAECHER[fach]);
  fortschritt[carta.id] = e;
  guardar(fortschritt);
}

function empezarRonda(){
  ronda = armarRonda(); indice = 0; aciertos = 0;
  $("haupt").disabled = false;
  if(!ronda.length){
    $("typ").textContent = ""; $("frage").textContent = "¡Todo repasado por hoy!";
    $("antwort").hidden = true; $("umlaute").hidden = true;
    $("haupt").hidden = true; $("loesung").hidden = true;
    return;
  }
  mostrarPregunta();
}

function mostrarPregunta(){
  resuelto = false;
  const c = ronda[indice];
  $("contador").textContent = "Tarjeta " + (indice+1) + " / " + ronda.length + " · " + c.thema;
  $("puntos").textContent = "Aciertos: " + aciertos;
  $("typ").textContent = TYP_ES[c.typ] || "";
  $("frage").textContent = c.es;
  $("loesung").hidden = true;
  const inp = $("antwort");
  inp.hidden = false; inp.disabled = false; inp.value = "";
  $("umlaute").hidden = false;
  $("haupt").textContent = "Comprobar";
  $("haupt").classList.remove("siguiente");
  inp.focus();
}

function resolver(){
  const c = ronda[indice];
  const r = comprobar($("antwort").value, c);
  if(r === "richtig"){ aciertos++; $("urteil").textContent = "¡Correcto!"; $("urteil").style.color = "var(--gruen)"; }
  else if(r === "fast"){ $("urteil").textContent = "Casi — mira el artículo / la ortografía"; $("urteil").style.color = "var(--gelb)"; }
  else { $("urteil").textContent = "Incorrecto"; $("urteil").style.color = "var(--rot)"; }
  actualizarEstado(c, r);

  $("wort").textContent = c.art ? c.art + " " + c.de : c.de;

  const g = $("gramatica");
  if(c.typ === "nomen"){
    g.style.color = "var(--grau)";
    g.textContent = (c.plural === "nur Plural" || c.plural === "nur Singular")
      ? c.plural : (c.plural ? "Plural: die " + c.plural : "");
  } else if(c.typ === "verb"){
    g.style.color = KASUS_COLOR[c.kasus] || "var(--gruen)";
    g.textContent = "→ " + c.kasus;
  } else { g.textContent = ""; }

  const extra = [];
  if(c.perfekt) extra.push("Perfekt: " + c.perfekt);
  if(c.bsp) extra.push(c.bsp);
  if(c.alt.length) extra.push("también: " + c.alt.join(", "));
  $("extra").textContent = extra.join("\n");
  $("ton-frase").hidden = !c.bsp;

  $("loesung").hidden = false;
  $("antwort").disabled = true;
  $("antwort").blur();                       // Tastatur schliessen, Lösung sichtbar
  $("haupt").textContent = "Siguiente";
  $("haupt").classList.add("siguiente");
  resuelto = true;
  hablar(textoHablado(c));                   // im Tap-Handler: iOS erlaubt die Ausgabe
}

function terminarRonda(){
  const cuota = Math.round(100 * aciertos / Math.max(1, ronda.length));
  $("typ").textContent = "";
  $("frage").textContent = aciertos + " / " + ronda.length + " · " + cuota + " %";
  $("antwort").hidden = true; $("umlaute").hidden = true;
  $("loesung").hidden = false;
  $("urteil").textContent = "Ronda terminada"; $("urteil").style.color = "var(--gruen)";
  $("wort").textContent = ""; $("gramatica").textContent = "";
  $("extra").textContent = "";
  $("ton-frase").hidden = true;
  document.querySelector(".tonos").hidden = true;
  $("haupt").textContent = "Otra ronda";
  $("haupt").classList.remove("siguiente");
  resuelto = false;
  $("haupt").onclick = () => {
    document.querySelector(".tonos").hidden = false;
    $("haupt").onclick = siguiente;
    empezarRonda();
  };
}

function siguiente(){
  if(!resuelto){ resolver(); return; }
  indice++;
  if(indice >= ronda.length) terminarRonda(); else mostrarPregunta();
}

/* ------------------------------------------------------------------ Bindung */
["ä","ö","ü","ß","Ä","Ö","Ü"].forEach(z=>{
  const b = document.createElement("button");
  b.textContent = z;
  b.onclick = () => {
    const i = $("antwort");
    const p = i.selectionStart ?? i.value.length;
    i.value = i.value.slice(0,p) + z + i.value.slice(i.selectionEnd ?? p);
    i.focus(); i.setSelectionRange(p+1, p+1);
  };
  $("umlaute").appendChild(b);
});

$("haupt").onclick = siguiente;
$("antwort").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); siguiente(); } });
$("ton-palabra").onclick = () => hablar(textoHablado(ronda[indice]));
$("ton-frase").onclick = () => hablar(ronda[indice].bsp);
$("voz").onchange = () => {
  vozActual = voces[+$("voz").value] || null;
  try{ if(vozActual) localStorage.setItem("voz", vozActual.name); }catch(e){}
  hablar("Guten Tag. Ich spreche Hochdeutsch.");
};
$("probar").onclick = () => hablar("Guten Tag. Ich spreche Hochdeutsch.");

if(window.speechSynthesis){
  cargarVoces();
  speechSynthesis.onvoiceschanged = cargarVoces;
  setTimeout(cargarVoces, 800);              // iOS liefert die Liste verzögert
}
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
empezarRonda();
</script>
</body>
</html>
