<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#f4f4f2">
<link rel="manifest" href="manifest.webmanifest">

<title>Vokabeltrainer ES → DE</title>
<style>
:root{
  --bg:#f7d4e2; --karte:#fce4ec; --text:#1c1c1c; --grau:#6b6b6b;
  --blau:#1f5fa9; --gruen:#1a7f37; --rot:#c22b2b; --gelb:#a86400; --lila:#6b3fa0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
header{display:flex;justify-content:space-between;font-size:13px;color:var(--grau);padding:12px 18px 6px}
main{
  flex:0 0 auto; min-height:60vh; margin:0 12px; background:var(--karte);
  border:1px solid #eebcd0; border-radius:16px; padding:18px 16px;
  display:flex; flex-direction:column;
}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 18px 14px;font-size:13px;color:var(--grau)}
#typ{font-size:13px;color:var(--grau);text-align:center;margin-top:6px}
#frage{font-size:34px;font-weight:700;text-align:center;margin:6px 0 18px;line-height:1.15}
#ton-es{
  align-self:center;margin:-8px 0 14px;padding:6px 14px;font-size:13px;border:0;
  border-radius:10px;background:#f3cadb;color:var(--grau);font-family:inherit;
}
#antwort{
  width:100%; font-size:22px; text-align:center; padding:14px 10px; border:0;
  border-radius:12px; background:#ffffff; color:var(--text); font-family:inherit;
}
#antwort:focus{outline:2px solid var(--blau)}
#umlaute{display:flex;justify-content:center;gap:6px;margin:10px 0}
#umlaute button{
  flex:0 0 auto; min-width:44px; padding:10px 0; font-size:17px; border:0;
  border-radius:10px; background:#f3cadb; color:var(--text); font-family:inherit;
}
#haupt{
  width:100%; margin-top:4px; padding:16px; font-size:17px; font-weight:600; border:0;
  border-radius:12px; background:var(--blau); color:#fff; font-family:inherit;
}
#haupt.siguiente{background:#3a3a38}
#loesung{margin-top:18px;text-align:center}
#urteil{font-size:15px;font-weight:700}
#wort{font-size:28px;font-weight:700;margin:4px 0}
#gramatica{font-size:17px;font-weight:600;margin-top:2px}
#extra{font-size:16px;color:var(--grau);white-space:pre-line;margin-top:10px;line-height:1.5;
  padding-top:10px;border-top:1px solid #eebcd0}
.tonos{display:flex;justify-content:center;gap:8px;margin-top:14px}
.tonos button{
  padding:10px 16px;font-size:15px;border:0;border-radius:10px;
  background:#f3cadb;color:var(--text);font-family:inherit;
}
#nivel,#tema{font-size:13px;font-family:inherit;color:var(--grau);background:#f3cadb;border:0;border-radius:8px;padding:7px}
#tema{max-width:38vw}
#nivel{max-width:34vw}
#voz{
  flex:1; min-width:0; font-size:13px; font-family:inherit; color:var(--grau);
  background:#f3cadb; border:0; border-radius:8px; padding:7px;
}
#probar,#autoes{padding:7px 12px;font-size:13px;border:0;border-radius:8px;background:#f3cadb;font-family:inherit}
#sinvoz{color:var(--rot);font-size:12px;line-height:1.3}
button{cursor:pointer}
#tablero{
  margin:0 12px 22px; background:var(--karte); border:1px solid #eebcd0;
  border-radius:16px; padding:14px 16px;
}
#tablero h2{font-size:14px;margin:0 0 8px;font-weight:700}
#tablero .leyenda{font-size:12px;color:var(--grau);margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 12px}
#tablero .leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* Übungszeit */
#hoy{background:#fbd9e6;border-radius:12px;padding:12px 14px;margin-bottom:14px}
#hoy .cabeza{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#hoy .grande{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
#hoy .sub{font-size:12px;color:var(--grau);text-align:right}
.semana{display:flex;align-items:flex-end;gap:6px;height:62px;margin-top:12px;position:relative}
.semana .meta{position:absolute;left:0;right:0;border-top:1px dashed var(--grau);opacity:.55}
.semana b.logrado{background:var(--gruen)}
#hoy .medias{font-size:12px;color:var(--grau);margin-top:10px;line-height:1.5}
#hoy .medias b{color:var(--text)}
#hoy .medias b.falta{color:var(--rot)}
#hoy .medias b.logrado{color:var(--gruen)}
.semana .dia{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.semana b{display:block;width:100%;background:var(--gelb);border-radius:3px 3px 0 0}
.semana em{font-size:10px;color:var(--grau);font-style:normal;margin-top:3px}

/* Gesamtstand oben */
#resumen{background:#fbd9e6;border-radius:12px;padding:12px 14px;margin-bottom:12px}
#resumen .cabeza{display:flex;justify-content:space-between;align-items:baseline}
#resumen .grande{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
#resumen .sub{font-size:12px;color:var(--grau)}
#resumen .pila{height:12px;border-radius:6px;margin-top:8px}

/* Sicherung */
#datos{margin-top:16px;padding-top:14px;border-top:1px solid #eebcd0}
#datos h2{margin:0 0 4px}
#datos .nota{font-size:12px;color:var(--grau);margin:0 0 8px;line-height:1.45}
#datos .botones{display:flex;gap:8px;margin-bottom:8px}
#datos button,#datos .boton{
  padding:9px 16px;font-size:13px;border:0;border-radius:9px;background:#f3cadb;
  color:var(--text);font-family:inherit;cursor:pointer;
}

/* Kacheln je Sachgebiet */
#fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.ficha{background:#fdeef4;border:1px solid #f6dbe6;border-radius:10px;padding:8px 10px}
.ficha.activo{border-color:var(--rosa,#c2185b);background:#fbd9e6}
.ficha .titulo{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ficha .nombre{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha .pct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.ficha .cifras{font-size:11px;color:var(--grau);margin-top:4px;font-variant-numeric:tabular-nums}
.pila{display:flex;height:7px;background:#f3cadb;border-radius:4px;overflow:hidden;margin-top:6px}
.pila i{background:var(--gruen)}
.pila u{background:var(--gelb)}
[hidden]{display:none !important}
</style>
</head>
<body>
<header><span id="contador"></span><span id="puntos"></span></header>

<main>
  <div id="typ"></div>

  <button id="ton-es" hidden>🔊 español</button>
  <input id="antwort" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="palabra en alemán">
  <div id="umlaute"></div>
  <button id="haupt">Comprobar</button>

  <section id="loesung" hidden>
    <div id="urteil"></div>
    <div id="wort"></div>
    <div id="gramatica"></div>
    <div id="extra"></div>
    <div class="tonos">
      <button id="ton-palabra">🔊 palabra</button>
      <button id="ton-frase" hidden>🔊 frase</button>
    </div>
  </section>
</main>

<footer>
  <span>nivel:</span>
  <select id="nivel"></select>
  <span>tema:</span>
  <select id="tema"></select>
  <span>voz:</span>
  <select id="voz"></select>
  <button id="probar">probar</button>
  <button id="autoes" hidden></button>
  <span id="sinvoz" hidden></span>
</footer>

<section id="tablero"></section>

/* ---------------------------------------------------------------- Fortschritt */
function cargar(){
  let f = {};
  try{ f = JSON.parse(localStorage.getItem("fortschritt") || "{}"); }catch(e){ return {}; }
  // Altbestand ohne Zeitstempel: aus Fälligkeit und Fach zurückgerechnet
  let migrado = false;
  Object.values(f).forEach(e => {
    if(!e.zuletzt){
      const base = e.faellig ? Date.parse(e.faellig + "T12:00:00") : Date.now();
      e.zuletzt = base - (FAECHER[e.fach || 1] || 0) * 86400000;
      migrado = true;
    }
  });
  if(migrado) try{ localStorage.setItem("fortschritt", JSON.stringify(f)); }catch(e){}
  return f;
}
function guardar(datos){
  try{ localStorage.setItem("fortschritt", JSON.stringify(datos)); }catch(e){}
}
function fecha(d = new Date()){          // lokales Datum, nicht UTC
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
const hoy = () => fecha();
function masDias(dias){
  const d = new Date(); d.setDate(d.getDate()+dias);
  return fecha(d);
}

/* ---------------------------------------------------- Übungszeit pro Tag */
const META = 60;             // Tagesziel in Minuten
const PAUSA_MAX = 60;        // Sekunden, die zwischen zwei Aktionen höchstens zählen
let tiempos = {};
try{ tiempos = JSON.parse(localStorage.getItem("tiempos") || "{}"); }catch(e){ tiempos = {}; }

/* Gezählt wird ausschliesslich die Spanne zwischen zwei Eingaben. Kein Ticker,
   keine Zeit fürs blosse Offenhaben der Seite. Liegen mehr als PAUSA_MAX Sekunden
   zwischen zwei Aktionen, zählt die Spanne gar nicht. */
let ultimaAccion = 0;        // 0 = seit dem Öffnen noch keine Eingabe
let ultimoGuardado = 0;

function migrarTiempos(){
  // altes Format {fecha:{seg,tarjetas}} -> {fecha:{geraet:{seg,tarjetas}}}
  let cambio = false;
  Object.entries(tiempos).forEach(([d, v]) => {
    if(v && typeof v.seg === "number"){
      tiempos[d] = {[DISPOSITIVO]: {seg: v.seg, tarjetas: v.tarjetas || 0}};
      cambio = true;
    }
  });
  if(cambio) try{ localStorage.setItem("tiempos", JSON.stringify(tiempos)); }catch(e){}
}
migrarTiempos();

function registroHoy(){
  const d = hoy();
  if(!tiempos[d]) tiempos[d] = {};
  if(!tiempos[d][DISPOSITIVO]) tiempos[d][DISPOSITIVO] = {seg:0, tarjetas:0};
  return tiempos[d][DISPOSITIVO];
}
const segDia = d => Object.values(tiempos[d] || {}).reduce((a, x) => a + (x.seg || 0), 0);
const tarjetasDia = d => Object.values(tiempos[d] || {}).reduce((a, x) => a + (x.tarjetas || 0), 0);
function guardarTiempos(){
  const limite = masDias(-60);
  Object.keys(tiempos).forEach(d => { if(d < limite) delete tiempos[d]; });
  try{ localStorage.setItem("tiempos", JSON.stringify(tiempos)); }catch(e){}
}
function accion(){
  const ahora = Date.now();
  if(ultimaAccion){
    const spanne = (ahora - ultimaAccion) / 1000;
    if(spanne <= PAUSA_MAX) registroHoy().seg += spanne;
  }
  ultimaAccion = ahora;

/* --------------------------------------------------- Sicherung und Abgleich */
const FORMATO = {app: "vokabeltrainer", version: 1};

/* Zusammenführen ohne Verlust:
   - je Karte gewinnt der jüngere Zeitstempel, Zähler werden maximiert
   - Übungszeit je Tag und Gerät, deshalb beliebig oft zusammenführbar   */
function fusionar(local, ajeno){
  const f = {};
  Object.entries(local.fortschritt || {}).forEach(([k, v]) => f[k] = Object.assign({}, v));
  Object.entries(ajeno.fortschritt || {}).forEach(([k, a]) => {
    const l = f[k];
    const gana = !l || (a.zuletzt || 0) > (l.zuletzt || 0) ? a : l;
    f[k] = Object.assign({}, gana, {
      richtig: Math.max(a.richtig || 0, l ? l.richtig || 0 : 0),
      falsch:  Math.max(a.falsch  || 0, l ? l.falsch  || 0 : 0)
    });
  });

  const t = {};
  [local.tiempos || {}, ajeno.tiempos || {}].forEach(fuente => {
    Object.entries(fuente).forEach(([dia, aparatos]) => {
      t[dia] = t[dia] || {};
      Object.entries(aparatos || {}).forEach(([g, v]) => {
        const y = t[dia][g] || {seg:0, tarjetas:0};
        t[dia][g] = {seg: Math.max(y.seg || 0, v.seg || 0),
                     tarjetas: Math.max(y.tarjetas || 0, v.tarjetas || 0)};
      });
    });
  });
  return {fortschritt: f, tiempos: t};
}

function paquete(){
  return Object.assign({}, FORMATO, {
    exportado: new Date().toISOString(),
    dispositivo: DISPOSITIVO,
    fortschritt, tiempos
  });
}

async function exportar(){
  const texto = JSON.stringify(paquete());
  const nombre = "vokabeln-" + hoy() + ".json";
  const blob = new Blob([texto], {type: "application/json"});
  try{
    const archivo = new File([blob], nombre, {type: "application/json"});
    if(navigator.canShare && navigator.canShare({files: [archivo]})){
      await navigator.share({files: [archivo], title: nombre});   // iOS: Teilen-Menü
      return aviso("Copia creada.");
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  aviso("Copia creada.");
}

function importar(archivo){
  const lector = new FileReader();
  lector.onload = () => {
    let datos;
    try{ datos = JSON.parse(lector.result); }
    catch(e){ return aviso("Archivo ilegible.", true); }
    if(datos.app !== FORMATO.app) return aviso("Ese archivo no es del vokabeltrainer.", true);

    const antes = Object.keys(fortschritt).length;
    const unido = fusionar({fortschritt, tiempos}, datos);
    fortschritt = unido.fortschritt;
    tiempos = unido.tiempos;
    guardar(fortschritt);
    guardarTiempos();
    const nuevas = Object.keys(fortschritt).length - antes;
    aviso(`Unido: ${Object.keys(fortschritt).length} tarjetas (${nuevas} nuevas).`);
    empezarRonda();
    tablero();
  };
  lector.onerror = () => aviso("No se pudo leer el archivo.", true);
  lector.readAsText(archivo);
}

function aviso(texto, malo){
  const e = $("avisoDatos");
  if(!e) return;
  e.textContent = texto;
  e.style.color = malo ? "var(--rot)" : "var(--gruen)";
}

/* ------------------------------------------------------------ Antwortprüfung */
function normalizar(t){
  t = t.trim().toLowerCase();
  t = t.replace(/^(der|die|das)\s+/,"").replace(/^sich\s+/,"");
  t = t.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  return t.replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
}
function articuloDe(t){
  const m = t.trim().toLowerCase().match(/^(der|die|das)\b/);
  return m ? m[1] : null;
}
function distancia(a,b){
  if(a === b) return 0;
  let prev = Array.from({length:b.length+1}, (_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const act=[i];
    for(let j=1;j<=b.length;j++){
      act.push(Math.min(prev[j]+1, act[j-1]+1, prev[j-1]+(a[i-1]!==b[j-1]?1:0)));
    }
    prev=act;
  }
  return prev[b.length];
}
function comprobar(entrada, carta){
  if(!entrada.trim()) return "falsch";
  const usuario = normalizar(entrada);
  const soluciones = [normalizar(carta.de), ...carta.alt.map(normalizar)];
  if(soluciones.includes(usuario)){
    const art = articuloDe(entrada);
    if(carta.typ === "nomen" && art && art !== carta.art) return "fast";
    return "richtig";
  }
  for(const s of soluciones){
    if(s.length >= 5 && distancia(usuario, s) <= 1) return "fast";
  }
  return "falsch";
}

let vozEs = null, autoEs = true;
try{ autoEs = localStorage.getItem("autoes") !== "no"; }catch(e){}

/* Spanische Stimme: erst lateinamerikanische Varianten, dann alles Übrige */
function elegirVozEs(todas){
  const es = todas.filter(v => (v.lang || "").toLowerCase().startsWith("es"));
  const orden = ["es-co", "es-mx", "es-us", "es-419", "es-ar", "es-cl", "es-es"];
  es.sort((a, b) => {
    const pa = orden.indexOf(a.lang.toLowerCase()), pb = orden.indexOf(b.lang.toLowerCase());
    return (pa < 0 ? 99 : pa) - (pb < 0 ? 99 : pb);
  });
  return es[0] || null;
}

function cargarVoces(){
  const todas = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  vozEs = elegirVozEs(todas);
  $("ton-es").hidden = !vozEs;
  $("autoes").hidden = !vozEs;
  $("autoes").textContent = "🔊 es: " + (autoEs ? "sí" : "no");
  voces = todas.filter(v => (v.lang||"").toLowerCase().startsWith("de"));
  voces.sort((a,b)=>{
    const pa = a.lang.toLowerCase().startsWith("de-de") ? 0 : 1;
    const pb = b.lang.toLowerCase().startsWith("de-de") ? 0 : 1;
    return pa-pb || a.name.localeCompare(b.name);
  });
  const sel = $("voz");
  sel.innerHTML = "";
  voces.forEach((v,i)=>{
    const o = document.createElement("option");
    o.value = i; o.textContent = v.name + " (" + v.lang + ")";
    sel.appendChild(o);
  });
  const guardada = (()=>{ try{ return localStorage.getItem("voz"); }catch(e){ return null; } })();
  const idx = Math.max(0, voces.findIndex(v => v.name === guardada));
  vozActual = voces[idx] || null;
  sel.value = String(idx < 0 ? 0 : idx);
  const hay = voces.length > 0;
  sel.hidden = !hay; $("probar").hidden = !hay;
  $("sinvoz").hidden = hay;
  if(!hay) $("sinvoz").textContent = AVISO_SIN_VOZ;
}

/* Nur deutsche Stimmen — ohne deutsche Stimme bleibt es stumm. */
function hablar(texto){
  if(!texto || !vozActual || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.voice = vozActual;
    u.lang = vozActual.lang || "de-DE";
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function fraseCompleta(c){ return c.satz.replace("___", c.de); }
function textoEs(c){
  return (c.es || "").replace(/\s*\/\s*/g, " o ");
}
function hablarEs(texto){
  if(!texto || !vozEs || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.voice = vozEs;
    u.lang = vozEs.lang || "es-ES";
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* Nur echte Synonyme, keine reinen Schreibvarianten wie gross/groß */
function sinonimos(c){
  const base = normalizar(c.de);
  return (c.alt || []).filter(a => normalizar(a) !== base);
}
function textoHablado(c){
  let texto;
  if(c.satz){
    texto = fraseCompleta(c);
  } else if(c.typ === "nomen"){
    texto = c.art ? c.art + " " + c.de : c.de;
    if(c.plural && c.plural !== "nur Plural" && c.plural !== "nur Singular")
      texto += ". Plural: die " + c.plural + ".";
  } else {
    texto = c.de;
  }
  const otros = sinonimos(c);
  if(otros.length) texto = texto.replace(/\.\s*$/, "") + ". Auch: " + otros.join(", ") + ".";
  return texto;
}

/* ------------------------------------------------------------------- Ablauf */
let fortschritt = cargar(), ronda = [], indice = 0, aciertos = 0, resuelto = false;

let nivel = "alle", tema = "alle";
const NIVELES = [["alle","todo"],["A1","A1"],["A2","A2"],["B1","B1"],
                 ["A1+A2","A1+A2"],["A1+A2+B1","A1+A2+B1"]];
function nivelOk(c, n){ return n === "alle" || n.split("+").includes(c.niveau); }
function filtradas(){
  let f = VOKABELN;
  if(nivel !== "alle") f = f.filter(c => nivelOk(c, nivel));
  if(tema !== "alle") f = f.filter(c => c.thema === tema);
  return f;
}
function armarRonda(){
  const h = hoy(), vencidas = [], nuevas = [];
  const fuente = filtradas();
  fuente.forEach(c=>{
    const e = fortschritt[c.id];
    if(!e) nuevas.push(c);
    else if((e.faellig || h) <= h) vencidas.push([e.fach||1, c]);
  });
  vencidas.sort((a,b)=>a[0]-b[0]);
  let r = vencidas.slice(0, POR_RONDA).map(p=>p[1]);
  nuevas.sort(()=>Math.random()-0.5);
  r = r.concat(nuevas.slice(0, Math.max(0, POR_RONDA - r.length)));
  return r.sort(()=>Math.random()-0.5);
}

function actualizarEstado(carta, resultado){
  const e = fortschritt[carta.id] || {fach:1, richtig:0, falsch:0};
  let fach = e.fach || 1;
  if(resultado === "richtig"){ fach = Math.min(5, fach+1); e.richtig = (e.richtig||0)+1; }
  else if(resultado === "falsch"){ fach = 1; e.falsch = (e.falsch||0)+1; }
  e.fach = fach;
  e.faellig = masDias(FAECHER[fach]);
  e.zuletzt = Date.now();
  fortschritt[carta.id] = e;
  guardar(fortschritt);
  tablero();
}

function empezarRonda(){
  ronda = armarRonda(); indice = 0; aciertos = 0;
  $("haupt").disabled = false;
  if(!ronda.length){
    const vacio = filtradas().length === 0;
    $("typ").textContent = "";
    $("frage").textContent = vacio ? "Sin tarjetas" : "¡Todo repasado por hoy!";
    $("loesung").hidden = false;
    $("urteil").textContent = "";
    $("wort").textContent = ""; $("gramatica").textContent = "";
    $("extra").textContent = vacio
      ? "Este filtro no tiene tarjetas. Elige otro tema o nivel."
      : "Vuelve mañana — las tarjetas están programadas.";
    document.querySelector(".tonos").hidden = true;
    $("antwort").hidden = true; $("umlaute").hidden = true;
    $("haupt").hidden = true;
    return;
  }
  $("haupt").hidden = false;
  document.querySelector(".tonos").hidden = false;
  mostrarPregunta();
}

function mostrarPregunta(){
  resuelto = false;
  const c = ronda[indice];
  $("contador").textContent = "Tarjeta " + (indice+1) + " / " + ronda.length + " · " + c.thema;
  $("puntos").textContent = "Aciertos: " + aciertos;
  $("typ").textContent = (TYP_ES[c.typ] || "") + (c.satz ? "   ·   " + c.es : "");
  $("frage").textContent = c.satz || c.es;
  if(autoEs) hablarEs(textoEs(c));
  $("loesung").hidden = true;
  const inp = $("antwort");
  inp.hidden = false; inp.disabled = false; inp.value = "";
  $("umlaute").hidden = false;
  $("haupt").textContent = "Comprobar";
  $("haupt").classList.remove("siguiente");
  inp.focus();
}

function resolver(){
  registroHoy().tarjetas++;
  const c = ronda[indice];
  const r = comprobar($("antwort").value, c);
  if(r === "richtig"){ aciertos++; $("urteil").textContent = "¡Correcto!"; $("urteil").style.color = "var(--gruen)"; }
  else if(r === "fast"){ $("urteil").textContent = "Casi — mira el artículo / la ortografía"; $("urteil").style.color = "var(--gelb)"; }
  else { $("urteil").textContent = "Incorrecto"; $("urteil").style.color = "var(--rot)"; }
  actualizarEstado(c, r);

  $("wort").textContent = c.satz ? fraseCompleta(c) : (c.art ? c.art + " " + c.de : c.de);

  const g = $("gramatica");
  if(c.typ === "nomen"){
    g.style.color = "var(--grau)";
    g.textContent = (c.plural === "nur Plural" || c.plural === "nur Singular")
      ? c.plural : (c.plural ? "Plural: die " + c.plural : "");
  } else if(c.typ === "verb"){
    g.style.color = KASUS_COLOR[c.kasus] || "var(--gruen)";
    g.textContent = "→ " + c.kasus;
  } else if(c.kasus){ g.style.color = "var(--grau)"; g.textContent = c.kasus; }
  else { g.textContent = ""; }

  const extra = [];
  if(c.perfekt) extra.push("Perfekt: " + c.perfekt);
  if(c.bsp) extra.push(c.bsp);
  if(c.alt.length) extra.push("también: " + c.alt.join(", "));
  $("extra").textContent = extra.join("\n");
  $("ton-frase").hidden = !c.bsp;

  $("loesung").hidden = false;
  $("umlaute").hidden = true;
  $("antwort").disabled = true;
  if(window.matchMedia("(hover: none)").matches) $("antwort").blur();   // nur Handy
  $("loesung").scrollIntoView({block:"nearest", behavior:"smooth"});
  $("haupt").textContent = "Siguiente";
  $("haupt").classList.add("siguiente");
  resuelto = true;
  hablar(textoHablado(c));                   // im Tap-Handler: iOS erlaubt die Ausgabe
}

function terminarRonda(){
  const cuota = Math.round(100 * aciertos / Math.max(1, ronda.length));
  $("typ").textContent = "";
  $("frage").textContent = aciertos + " / " + ronda.length + " · " + cuota + " %";
  $("antwort").hidden = true; $("umlaute").hidden = true;
  $("loesung").hidden = false;
  $("urteil").textContent = "Ronda terminada"; $("urteil").style.color = "var(--gruen)";
  $("wort").textContent = ""; $("gramatica").textContent = "";
  $("extra").textContent = "";
  $("ton-frase").hidden = true;
  document.querySelector(".tonos").hidden = true;
  $("haupt").textContent = "Otra ronda";
  $("haupt").classList.remove("siguiente");
  resuelto = false;
  $("haupt").onclick = () => {
    document.querySelector(".tonos").hidden = false;
    $("haupt").onclick = () => { $("haupt").blur(); siguiente(); };
    empezarRonda();
  };
}

function siguiente(){
  accion();
  if(!resuelto){ resolver(); return; }
  indice++;
  if(indice >= ronda.length) terminarRonda(); else mostrarPregunta();
}

/* Dashboard: Gesamtstand oben, darunter ein Raster mit einer Kachel je Gebiet */
function tablero(){
  const base = VOKABELN.filter(c => nivelOk(c, nivel));
  const filas = {};
  const suma = {total:0, sabe:0, casi:0};
  base.forEach(c => {
    const f = filas[c.thema] || (filas[c.thema] = {total:0, sabe:0, casi:0});
    const e = fortschritt[c.id];
    const clase = (e && e.fach >= 4) ? "sabe" : (e && e.fach >= 2) ? "casi" : null;
    f.total++; suma.total++;
    if(clase){ f[clase]++; suma[clase]++; }
  });

  const pila = f => {
    const s1 = f.total ? 100 * f.sabe / f.total : 0;
    const s2 = f.total ? 100 * f.casi / f.total : 0;
    return `<div class="pila"><i style="width:${s1}%"></i><u style="width:${s2}%"></u></div>`;
  };
  const pct = f => f.total ? Math.round(100 * f.sabe / f.total) : 0;

  const nombres = Object.keys(filas)
    .sort((a,b) => filas[b].total - filas[a].total || a.localeCompare(b));

  const r = registroHoy();
  const min = d => Math.round(segDia(d) / 60);

  const dias = [];
  for(let i = 6; i >= 0; i--){
    const d = masDias(-i);
    dias.push({d, min: min(d), letra: "DLMXJVS"[new Date(d + "T12:00:00").getDay()]});
  }
  const tope = Math.max(META, ...dias.map(x => x.min));

  let racha = 0;
  for(let i = 0; i < 90; i++){
    const d = masDias(-i);
    if(segDia(d) >= 60) racha++;
    else if(i > 0) break;
  }

  // Mittelwerte: Nulltage zählen mit, sonst schönt der Schnitt
  const media = n => {
    let suma = 0;
    for(let i = 0; i < n; i++) suma += min(masDias(-i));
    return n ? Math.round(suma / n) : 0;
  };
  const fechas = Object.keys(tiempos).sort();
  const inicio = fechas.length ? fechas[0] : hoy();
  const diasDesdeInicio = Math.max(1,
    Math.round((new Date(hoy() + "T12:00:00") - new Date(inicio + "T12:00:00")) / 86400000) + 1);
  const total = fechas.reduce((a, d) => a + min(d), 0);
  const mediaTotal = Math.round(total / diasDesdeInicio);
  const saldo = total - META * diasDesdeInicio;
  const horas = m => (m < 0 ? "−" : "+") + Math.floor(Math.abs(m) / 60) + " h " + (Math.abs(m) % 60) + " min";
  const pctMeta = Math.min(100, Math.round(100 * Math.round(segDia(hoy()) / 60) / META));

  $("tablero").innerHTML =
    `<h2>Hoy</h2>`
  + `<div id="hoy">`
  +   `<div class="cabeza"><span class="grande" id="hoyCifras">${Math.round(segDia(hoy())/60)} min</span>`
  +   `<span class="sub">de ${META} min &middot; ${tarjetasDia(hoy())} tarjetas`
  +   `${racha > 1 ? "<br>racha de " + racha + " días" : ""}</span></div>`
  +   `<div class="pila" style="height:9px;border-radius:5px"><i style="width:${pctMeta}%"></i></div>`
  +   `<div class="semana"><div class="meta" style="bottom:${Math.round(46 * META / tope) + 15}px"></div>`
  +     dias.map(x =>
        `<span class="dia"><b class="${x.min >= META ? "logrado" : ""}" `
        + `style="height:${Math.max(2, 46 * x.min / tope)}px" title="${x.min} min"></b>`
        + `<em>${x.letra}</em></span>`).join("")
  +   `</div>`
  +   `<div class="medias">media 7 días <b>${media(7)} min</b>`
  +     ` &middot; media total <b>${mediaTotal} min</b><br>`
  +     `saldo frente a la meta: <b class="${saldo < 0 ? "falta" : "logrado"}">${horas(saldo)}</b>`
  +     ` en ${diasDesdeInicio} días</div>`
  + `</div>`
  + `<h2>Tu progreso</h2>`
  + `<div id="resumen">`
  +   `<div class="cabeza"><span class="grande">${pct(suma)}%</span>`
  +   `<span class="sub">${suma.sabe} de ${suma.total} palabras</span></div>`
  +   pila(suma).replace('class="pila"', 'class="pila" style="height:12px;border-radius:6px"')
  + `</div>`
  + `<div id="fichas">`
  + nombres.map(n => {
      const f = filas[n];
      return `<div class="ficha ${n === tema ? "activo" : ""}">`
           + `<div class="titulo"><span class="nombre">${n}</span><span class="pct">${pct(f)}%</span></div>`
           + pila(f)
           + `<div class="cifras">${f.sabe} &middot; ${f.casi} &middot; ${f.total}</div></div>`;
    }).join("")
  + `</div>`
  + `<div id="datos">`
  +   `<h2>Copia de seguridad</h2>`
  +   `<p class="nota">Guarda el progreso en un archivo y llévalo a otro dispositivo. `
  +   `Al importar, los dos estados se combinan; no se pierde nada.</p>`
  +   `<div class="botones"><button id="btExportar">exportar</button>`
  +   `<label class="boton">importar<input type="file" id="btImportar" accept=".json,application/json" hidden></label></div>`
  +   `<p class="nota" id="avisoDatos"></p>`
  +   `<p class="nota">dispositivo: ${DISPOSITIVO}</p>`
  + `</div>`
  + `<p class="leyenda">`
  +   `<span><i style="background:var(--gruen)"></i>sabe (caja 4–5)</span>`
  +   `<span><i style="background:var(--gelb)"></i>casi (caja 2–3)</span>`
  +   `<span><i style="background:#f3cadb"></i>por aprender</span>`
  + `</p>`;

  $("btExportar").onclick = exportar;
  $("btImportar").onchange = ev => { if(ev.target.files[0]) importar(ev.target.files[0]); ev.target.value = ""; };
}

function refrescarHoy(){
  const e = $("hoyCifras");
  if(e) e.textContent = Math.round(segDia(hoy())/60) + " min";
}

/* ------------------------------------------------------------------ Bindung */
["ä","ö","ü","ß","Ä","Ö","Ü"].forEach(z=>{
  const b = document.createElement("button");
  b.textContent = z;
  b.onclick = () => {
    accion();
    const i = $("antwort");
    const p = i.selectionStart ?? i.value.length;
    i.value = i.value.slice(0,p) + z + i.value.slice(i.selectionEnd ?? p);
    i.focus(); i.setSelectionRange(p+1, p+1);
  };
  $("umlaute").appendChild(b);
});

$("haupt").onclick = () => { $("haupt").blur(); siguiente(); };
let ultimoEnter = 0;
document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  e.preventDefault();
  const ahora = Date.now();
  if(ahora - ultimoEnter < 150) return;     // Doppelauslösung abfangen
  ultimoEnter = ahora;
  siguiente();
});
$("antwort").addEventListener("input", accion);
$("ton-es").onclick = () => { accion(); hablarEs(textoEs(ronda[indice])); };
$("autoes").onclick = () => {
  autoEs = !autoEs;
  try{ localStorage.setItem("autoes", autoEs ? "si" : "no"); }catch(e){}
  $("autoes").textContent = "🔊 es: " + (autoEs ? "sí" : "no");
  if(autoEs) hablarEs(textoEs(ronda[indice]));
};
$("ton-palabra").onclick = () => { accion(); hablar(textoHablado(ronda[indice])); };
$("ton-frase").onclick = () => { accion(); hablar(ronda[indice].bsp); };
$("voz").onchange = () => {
  vozActual = voces[+$("voz").value] || null;
  try{ if(vozActual) localStorage.setItem("voz", vozActual.name); }catch(e){}
  hablar("Guten Tag. Ich spreche Hochdeutsch.");
};
$("probar").onclick = () => hablar("Guten Tag. Ich spreche Hochdeutsch.");
const TEMAS = (() => {
  const c = {};
  VOKABELN.forEach(x => { c[x.thema] = (c[x.thema] || 0) + 1; });
  return Object.keys(c).sort((a,b) => c[b] - c[a] || a.localeCompare(b));
})();

/* Zahl in jedem Feld gegen den jeweils anderen Filter rechnen */
function etiquetas(){
  const porNivel = VOKABELN.filter(c => nivelOk(c, nivel));
  const selT = $("tema");
  selT.innerHTML = "";
  selT.appendChild(new Option("todos (" + porNivel.length + ")", "alle"));
  TEMAS.forEach(n => selT.appendChild(
    new Option(n + " (" + porNivel.filter(c => c.thema === n).length + ")", n)));
  selT.value = tema;

  const porTema = (tema === "alle") ? VOKABELN : VOKABELN.filter(c => c.thema === tema);
  const selN = $("nivel");
  selN.innerHTML = "";
  NIVELES.forEach(([v, texto]) => {
    const n = porTema.filter(c => nivelOk(c, v)).length;
    selN.appendChild(new Option(texto + " (" + n + ")", v));
  });
  selN.value = nivel;
  tablero();
}

try{
  const gn = localStorage.getItem("nivel"); if(gn) nivel = gn;
  const gt = localStorage.getItem("tema"); if(gt) tema = gt;
}catch(e){}
etiquetas();

$("nivel").onchange = () => {
  nivel = $("nivel").value;
  try{ localStorage.setItem("nivel", nivel); }catch(e){}
  etiquetas();
  empezarRonda();
};
$("tema").onchange = () => {
  tema = $("tema").value;
  try{ localStorage.setItem("tema", tema); }catch(e){}
  etiquetas();
  empezarRonda();
};

if(window.speechSynthesis){
  cargarVoces();
  speechSynthesis.onvoiceschanged = cargarVoces;
  setTimeout(cargarVoces, 800);              // iOS liefert die Liste verzögert
}
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
empezarRonda();
</script>
